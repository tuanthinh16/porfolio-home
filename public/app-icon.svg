<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141f2d" />
      <stop offset="100%" stop-color="#0a0f16" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6be5f1" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#243447" stop-opacity="0.45" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- App squircle container with sleek cyber gradient border -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bg)" stroke="url(#border)" stroke-width="12" />
  <!-- Monogram d. matching the website brand mark (d in crisp white/cyan tint, dot in neon lime) -->
  <text x="215" y="348" fill="#f3f5fa" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Outfit', 'Helvetica Neue', Arial, sans-serif" font-size="280" font-weight="700" letter-spacing="-16" text-anchor="middle">d</text>
  <circle cx="340" cy="328" r="34" fill="#d7f88c" filter="url(#glow)"/>
</svg>